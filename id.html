<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">

    <!-- Preload Fonts: Plus Jakarta Sans for Pristine Enterprise Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        ojk: { red: '#c8102e', dark: '#0f172a' },
                    },
                    animation: {
                        'slide-up-fade': 'slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        slideUpFade: { 
                            '0%': { opacity: '0', transform: 'translateY(30px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        }
                    }
                }
            }
        }

    <!-- Custom CSS untuk Clean Architecture Transitions -->
    <style>
        body { margin: 0; overflow: hidden; background-color: #f8fafc; }

        /* Iframe Target State (Clean Sharp Reveal) */
        #app-container {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #app-container.app-active { 
            opacity: 1; 
            transform: translateY(0) scale(1);
        }

        /* Master Splash Canvas Transition (Smooth Elevation Drop) */
        #splash-wrapper {
            transition: transform 1.2s cubic-bezier(0.65, 0, 0.05, 1), opacity 0.8s ease;
            transform-origin: top center;
            will-change: transform;
        }
        #splash-wrapper.slide-out {
            transform: translateY(-100%);
            opacity: 0.5;
            pointer-events: none;
        }

        /* Subtle Inner Shadow for Video Cards (Premium touch) */
        .video-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
            pointer-events: none;
            z-index: 10;
        }

        /* Menyembunyikan Scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-slate-900 selection:bg-red-100 selection:text-red-900">

                <source src="https://ik.imagekit.io/logojkdiy/Background%20Biru%20Abu%20Putih.mp4?updatedAt=1775700470199" type="video/mp4">

        <!-- ==========================================
             THE CLEAN MONOLITH (White Container)

                    </div>
                    <h2 class="text-[10px] lg:text-xs font-bold tracking-[0.2em] text-slate-400 uppercase mb-3"></h2>
                    <h1 class="text-4xl lg:text-6xl font-bold tracking-tight text-slate-900 leading-[1.05] mb-4">

                    <div class="flex items-baseline mb-3 lg:mb-4">

                        <span class="text-2xl lg:text-3xl text-slate-300 font-light ml-2">%</span>
                    </div>

                    <!-- Clean Hairline Progress Track -->
                    <div class="w-full h-1 bg-slate-100 rounded-full overflow-hidden relative">

                    </div>

                    <!-- Execution Logs -->
                    <div class="mt-4 lg:mt-6 flex flex-col gap-1.5">
                        <span id="log-text" class="text-xs lg:text-sm font-semibold text-slate-800 tracking-wide transition-opacity duration-300">
                            Menyiapkan ruang kerja...
                        </span>
                        <span id="sub-log" class="text-[9px] lg:text-[10px] text-slate-400 font-mono tracking-widest uppercase transition-opacity duration-300 flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            Sinkronisasi Node Sistem Aktif
                        </span>
                    </div>
                </div>

            </div>

            <!-- ==========================================
                 SISI KANAN: ASYMMETRIC BENTO GRID (Landscape Preserved)
                 ========================================== -->
            <!-- Background panel kanan abu sangat halus untuk diferensiasi visual -->
            <div class="w-full lg:w-[55%] h-[60%] lg:h-full bg-slate-50 border-l border-slate-100 flex flex-col justify-center p-4 lg:p-12 relative overflow-hidden">
                
                <!-- Bento Grid Structure -->
                <!-- Menggunakan CSS Grid untuk mengatur proporsi video. Baris pertama (Hero) sedikit lebih tinggi dari baris kedua. -->
                <div class="w-full h-full lg:h-[90%] grid grid-cols-2 grid-rows-[1.4fr_1fr] gap-3 lg:gap-6 relative z-10">
                    
                    <!-- BENTO ITEM 1 (HERO): Arsip OJK DIY -->
                    <div class="col-span-2 relative rounded-[1.5rem] lg:rounded-[2.5rem] overflow-hidden video-card bg-white shadow-[0_10px_30px_rgba(0,0,0,0.04)] group">

                        <div class="absolute top-4 left-4 lg:top-6 lg:left-6 px-3 py-1.5 lg:px-4 lg:py-2 bg-white/90 backdrop-blur-md rounded-full shadow-sm flex items-center gap-2 transition-transform duration-300 group-hover:scale-105">

                    </div>

                    <!-- BENTO ITEM 2: Jogja Istimewa -->
                    <div class="col-span-1 relative rounded-[1.2rem] lg:rounded-[2rem] overflow-hidden video-card bg-white shadow-[0_10px_30px_rgba(0,0,0,0.04)] group">
                        <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover transition-transform duration-[4s] ease-out group-hover:scale-105">
                            <source src="https://ik.imagekit.io/logojkdiy/JOGJA%20ISTIMEWA.mp4?updatedAt=1763092078008" type="video/mp4">
                        </video>
                        <!-- Crisp Pill Badge -->
                        <div class="absolute top-3 left-3 lg:top-5 lg:left-5 px-2.5 py-1.5 lg:px-4 lg:py-2 bg-white/90 backdrop-blur-md rounded-full shadow-sm flex items-center gap-2 transition-transform duration-300 group-hover:scale-105">
                            <div class="w-1.5 h-1.5 rounded-full bg-slate-400"></div>
                            <span class="text-[8px] lg:text-[10px] font-bold text-slate-800 tracking-wider">Tugu Jogja</span>
                        </div>
                    </div>

                    <!-- BENTO ITEM 3: Layanan Terintegrasi -->
                    <div class="col-span-1 relative rounded-[1.2rem] lg:rounded-[2rem] overflow-hidden video-card bg-white shadow-[0_10px_30px_rgba(0,0,0,0.04)] group">
                        <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover transition-transform duration-[4s] ease-out group-hover:scale-105">
                            <source src="https://ik.imagekit.io/logojkdiy/Layanan%20Terintegrasi%20-%2006032026%20(3).mp4?updatedAt=1772759127067" type="video/mp4">
                        </video>
                        <!-- Crisp Pill Badge -->
                        <div class="absolute top-3 left-3 lg:top-5 lg:left-5 px-2.5 py-1.5 lg:px-4 lg:py-2 bg-white/90 backdrop-blur-md rounded-full shadow-sm flex items-center gap-2 transition-transform duration-300 group-hover:scale-105">
                            <div class="w-1.5 h-1.5 rounded-full bg-slate-400"></div>
                            <span class="text-[8px] lg:text-[10px] font-bold text-slate-800 tracking-wider">SaaS</span>
                        </div>
                    </div>

                </div>

                <!-- Footer Watermark di sisi kanan untuk balance layout -->
                <div class="absolute bottom-4 right-6 lg:bottom-8 lg:right-12 text-[9px] lg:text-[10px] font-bold text-slate-300 tracking-widest uppercase">
                    Software as a Service &bull; LMSt
                </div>
            </div>

        </div>
    </div>

    <!-- Script Logika Frontend -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const LOADING_DURATION = 10000; // 10 Detik
            const UPDATE_INTERVAL = 30; // ~33fps
            const TOTAL_STEPS = LOADING_DURATION / UPDATE_INTERVAL;
            
            const progressFill = document.getElementById('progress-fill');
            const progressPercent = document.getElementById('progress-percent');
            const logText = document.getElementById('log-text');
            const subLog = document.getElementById('sub-log');
            
            const splashWrapper = document.getElementById('splash-wrapper');
            const appContainer = document.getElementById('app-container');
            
            // Clean System Logs Array
            const logs = [
                { msg: "Menyiapkan ruang kerja...", sub: "Memverifikasi Sertifikat Keamanan" },
                { msg: "Memuat modul kearsipan...", sub: "Mengunduh Database OJK DIY" },
                { msg: "Sinkronisasi kalender...", sub: "Mendekripsi Data Pimpinan" },
                { msg: "Membangun arsitektur visual...", sub: "Rendering Komponen Antarmuka" },
                { msg: "Menghubungkan layanan server...", sub: "Koneksi ke google.script.run" },
                { msg: "Penyelesaian integrasi...", sub: "Finalisasi State Aplikasi" }
            ];

            let currentStep = 0;

            const intervalId = setInterval(() => {
                currentStep++;
                
                // Ease-out Quad: Smooth and clean progression
                let ratio = currentStep / TOTAL_STEPS;
                let eased = ratio * (2 - ratio);
                let percent = Math.min(Math.floor(eased * 100), 100);

                // Update UI Progress Bar
                progressFill.style.width = `${percent}%`;
                
                // Update Numeric Counter (Optimized)
                if (progressPercent.innerText !== percent.toString()) {
                    progressPercent.innerText = percent;
                }

                // Update Logs Text (Clean crossfade)
                const logIndex = Math.min(Math.floor(ratio * logs.length), logs.length - 1);
                if (logText.innerText !== logs[logIndex].msg) {
                    logText.style.opacity = '0';
                    subLog.style.opacity = '0';
                    
                    setTimeout(() => {
                        logText.innerText = logs[logIndex].msg;
                        subLog.childNodes[2].nodeValue = " " + logs[logIndex].sub; // Keep the blinking dot
                        logText.style.opacity = '1';
                        subLog.style.opacity = '1';
                    }, 150);
                }

                // Penghentian dan Finalisasi
                if (currentStep >= TOTAL_STEPS) {
                    clearInterval(intervalId);
                    completeLoading();
                }
            }, UPDATE_INTERVAL);

            function completeLoading() {
                logText.innerText = "Akses terverifikasi.";
                logText.classList.replace('text-slate-800', 'text-emerald-600');
                subLog.childNodes[2].nodeValue = " Membuka Workspace Agenda";
                subLog.querySelector('span').classList.replace('bg-emerald-500', 'bg-emerald-600');

                // Theatrical "Clean Elevation Drop" Transition
                setTimeout(() => {
                    // 1. Splash Wrapper bergeser ke atas
                    splashWrapper.classList.add('slide-out');
                    
                    // 2. Iframe menajam dan kembali ke ukuran normal
                    appContainer.classList.add('app-active');
                    appContainer.classList.remove('pointer-events-none');
                    document.body.style.overflow = 'auto'; // Kembalikan scroll
                    
                    // 3. Garbage Collection
                    setTimeout(() => {
                        splashWrapper.remove();
                    }, 1200);

                }, 600);
            }
        });
    </script>
</body>
</html>
