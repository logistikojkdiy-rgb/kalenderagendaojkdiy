<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Agenda Eksklusif OJK DIY</title>
    
    <!-- ==========================================
         FAVICON & APP ICONS (Enterprise Standard)
         ========================================== -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://ik.imagekit.io/logojkdiy/Synergy%20Logo%20(1).png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://ik.imagekit.io/logojkdiy/Synergy%20Logo%20(1).png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://ik.imagekit.io/logojkdiy/Synergy%20Logo%20(1).png">
    <meta name="theme-color" content="#f8fafc">
    
    <!-- Preload Fonts: Plus Jakarta Sans for Crisp Enterprise Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        ojk: { red: '#c8102e', dark: '#0f172a' },
                    },
                    animation: {
                        'slide-up-fade': 'slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        slideUpFade: { 
                            '0%': { opacity: '0', transform: 'translateY(20px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS untuk Clean Transitions -->
    <style>
        body { margin: 0; overflow: hidden; background-color: #f8fafc; }

        /* Iframe Target State (Clean Fade In) */
        #app-container {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #app-container.app-active { 
            opacity: 1; 
            transform: translateY(0);
        }

        /* Master Splash Canvas Transition (Curtain Slide Up) */
        #splash-wrapper {
            transition: transform 1.2s cubic-bezier(0.65, 0, 0.05, 1), opacity 0.8s ease;
            transform-origin: top center;
            will-change: transform;
        }
        #splash-wrapper.slide-out {
            transform: translateY(-100%);
            opacity: 0.8;
            pointer-events: none;
        }

        /* Clean Scrollbar untuk panel kanan jika diperlukan */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-slate-900 selection:bg-red-100 selection:text-red-900">

    <!-- ==========================================
         LAYER 1: TARGET GOOGLE APPS SCRIPT IFRAME 
         ========================================== -->
    <div id="app-container" class="fixed inset-0 z-0 w-full h-full pointer-events-none bg-white">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbzV6ptMrM8UQ3obd_xFdJvHswYckI41Sv9hS5fS-MLKH1yE4knu63viBt0kalu7snfIYA/exec" 
            class="w-full h-full border-none"
            title="Sistem Agenda OJK DIY">
        </iframe>
    </div>

    <!-- ==========================================
         LAYER 2: SWISS MINIMALIST SPLASH SCREEN
         ========================================== -->
    <div id="splash-wrapper" class="fixed inset-0 z-50 flex flex-col lg:flex-row w-full h-full bg-white shadow-2xl">
        
        <!-- ==========================================
             SISI KIRI: TIPOGRAFI & PROGRESS (Ruang Putih Masif)
             ========================================== -->
        <div class="w-full lg:w-1/2 h-[45%] lg:h-full flex flex-col justify-between px-8 py-10 lg:px-24 lg:py-20 bg-white z-20">
            
            <!-- Top: Header Branding -->
            <div class="animate-slide-up-fade" style="animation-delay: 0.1s;">
                <div class="w-12 h-12 lg:w-16 lg:h-16 bg-red-50 rounded-2xl flex items-center justify-center mb-6 lg:mb-8 border border-red-100">
                    <svg class="w-6 h-6 lg:w-8 lg:h-8 text-ojk-red" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h2 class="text-xs lg:text-sm font-bold tracking-[0.2em] text-slate-400 uppercase mb-3">Software Internal</h2>
                <h1 class="text-3xl lg:text-5xl font-extrabold tracking-tight text-slate-900 leading-[1.1] mb-4">
                    Kalender Agenda<br>
                    <span class="text-slate-400">Kantor OJK DIY.</span>
                </h1>
                <p class="text-slate-500 font-normal text-sm lg:text-base leading-relaxed max-w-sm">
                    Akses terenkripsi. Memperbarui database kegiatan.
                </p>
            </div>

            <!-- Bottom: Linear Precision Progress -->
            <div class="w-full max-w-md mt-auto animate-slide-up-fade" style="animation-delay: 0.3s;">
                
                <!-- Huge Numeric Counter -->
                <div class="flex items-baseline mb-4">
                    <span id="progress-percent" class="text-6xl lg:text-8xl font-light tracking-tighter text-slate-900">0</span>
                    <span class="text-2xl lg:text-3xl text-slate-400 font-light ml-2">%</span>
                </div>

                <!-- Clean Hairline Progress Track -->
                <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden relative">
                    <div id="progress-fill" class="absolute left-0 top-0 bottom-0 w-0 bg-ojk-red rounded-full transition-all duration-100 ease-out"></div>
                </div>

                <!-- Subtle Execution Logs -->
                <div class="mt-5 flex flex-col gap-1.5">
                    <span id="log-text" class="text-xs lg:text-sm font-semibold text-slate-800 tracking-wide transition-opacity duration-300">
                        Inisiasi ruang kerja...
                    </span>
                    <span id="sub-log" class="text-[10px] text-slate-400 font-mono tracking-widest uppercase transition-opacity duration-300">
                        Memverifikasi Sertifikat Keamanan
                    </span>
                </div>
            </div>

            <!-- Footer Watermark -->
            <div class="absolute bottom-6 left-8 lg:left-24 text-[10px] font-bold text-slate-300 tracking-widest uppercase">
                Software as a Services &bull; LMSt
            </div>

        </div>

        <!-- ==========================================
             SISI KANAN: CLEAN MEDIA GRID (Background Abu Terang)
             ========================================== -->
        <div class="relative w-full lg:w-1/2 h-[55%] lg:h-full bg-slate-50 border-l border-slate-100 flex flex-col justify-center p-6 lg:p-16 overflow-hidden">
            
            <!-- Elemen Dekoratif Sangat Halus -->
            <div class="absolute top-0 right-0 w-full h-full bg-gradient-to-bl from-white via-transparent to-transparent opacity-60"></div>

            <div class="relative z-10 w-full max-w-xl mx-auto flex flex-col gap-4 lg:gap-6">
                
                <!-- Video 1: Layanan Terintegrasi (Crisp Card) -->
                <div class="relative w-full aspect-video lg:aspect-auto lg:h-[320px] bg-white rounded-[1.5rem] lg:rounded-[2rem] overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.04)] ring-1 ring-slate-900/5 group">
                    <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover transition-transform duration-[3s] ease-out group-hover:scale-105">
                        <source src="https://ik.imagekit.io/logojkdiy/Layanan%20Terintegrasi%20-%2006032026%20(3).mp4?updatedAt=1772759127067" type="video/mp4">
                    </video>
                    
                    <!-- Clean Pill Tag (Apple iOS Style) -->
                    <div class="absolute top-4 left-4 lg:top-6 lg:left-6 px-4 py-2 bg-white/90 backdrop-blur-md rounded-full shadow-sm border border-white/50 flex items-center gap-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-ojk-red animate-pulse"></div>
                        <span class="text-[10px] lg:text-xs font-bold text-slate-900 tracking-wider">Layanan Terintegrasi</span>
                    </div>
                </div>

                <!-- Video 2: Jogja Istimewa (Crisp Card) -->
                <div class="relative w-full aspect-video lg:aspect-auto lg:h-[320px] bg-white rounded-[1.5rem] lg:rounded-[2rem] overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.04)] ring-1 ring-slate-900/5 group">
                    <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover transition-transform duration-[3s] ease-out group-hover:scale-105">
                        <source src="https://ik.imagekit.io/logojkdiy/JOGJA%20ISTIMEWA.mp4?updatedAt=1763092078008" type="video/mp4">
                    </video>

                    <!-- Clean Pill Tag -->
                    <div class="absolute top-4 left-4 lg:top-6 lg:left-6 px-4 py-2 bg-white/90 backdrop-blur-md rounded-full shadow-sm border border-white/50 flex items-center gap-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-slate-900"></div>
                        <span class="text-[10px] lg:text-xs font-bold text-slate-900 tracking-wider">Jogja Istimewa</span>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Script Logika Frontend -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const LOADING_DURATION = 10000; // 10 Detik
            const UPDATE_INTERVAL = 30; // ~33fps untuk kelancaran optimal
            const TOTAL_STEPS = LOADING_DURATION / UPDATE_INTERVAL;
            
            const progressFill = document.getElementById('progress-fill');
            const progressPercent = document.getElementById('progress-percent');
            const logText = document.getElementById('log-text');
            const subLog = document.getElementById('sub-log');
            
            const splashWrapper = document.getElementById('splash-wrapper');
            const appContainer = document.getElementById('app-container');
            
            // Clean System Logs Array
            const logs = [
                { msg: "Inisiasi ruang kerja...", sub: "Memverifikasi Sertifikat Keamanan" },
                { msg: "Sinkronisasi kalender pimpinan...", sub: "Mengunduh Data Terenkripsi" },
                { msg: "Membangun arsitektur visual...", sub: "Rendering Komponen DOM" },
                { msg: "Menghubungkan layanan GAS...", sub: "Koneksi ke google.script.run" },
                { msg: "Menerapkan lapisan akses...", sub: "Validasi Otorisasi Pengguna" },
                { msg: "Penyelesaian integrasi...", sub: "Finalisasi State Aplikasi" }
            ];

            let currentStep = 0;

            const intervalId = setInterval(() => {
                currentStep++;
                
                // Ease-out Quad: Cepat di awal, melambat sangat halus di akhir (Clean transition)
                let ratio = currentStep / TOTAL_STEPS;
                let eased = ratio * (2 - ratio);
                let percent = Math.min(Math.floor(eased * 100), 100);

                // Update UI Progress Bar
                progressFill.style.width = `${percent}%`;
                
                // Update Numeric Counter
                if (progressPercent.innerText !== percent.toString()) {
                    progressPercent.innerText = percent;
                }

                // Update Logs Text (Rotasi yang bersih)
                const logIndex = Math.min(Math.floor(ratio * logs.length), logs.length - 1);
                if (logText.innerText !== logs[logIndex].msg) {
                    logText.style.opacity = '0';
                    subLog.style.opacity = '0';
                    
                    setTimeout(() => {
                        logText.innerText = logs[logIndex].msg;
                        subLog.innerText = logs[logIndex].sub;
                        logText.style.opacity = '1';
                        subLog.style.opacity = '1';
                    }, 150);
                }

                // Penghentian dan Finalisasi
                if (currentStep >= TOTAL_STEPS) {
                    clearInterval(intervalId);
                    completeLoading();
                }
            }, UPDATE_INTERVAL);

            function completeLoading() {
                logText.innerText = "Akses terverifikasi.";
                logText.classList.replace('text-slate-800', 'text-emerald-600');
                subLog.innerText = "Membuka Agenda Ruang Kerja";

                // Theatrical "Curtain Slide" Transition
                setTimeout(() => {
                    // 1. Geser layar putih ke atas secara presisi
                    splashWrapper.classList.add('slide-out');
                    
                    // 2. Tampilkan Iframe secara halus (fade in & slide up slighty)
                    appContainer.classList.add('app-active');
                    appContainer.classList.remove('pointer-events-none');
                    document.body.style.overflow = 'auto'; // Kembalikan scroll
                    
                    // 3. Garbage Collection
                    setTimeout(() => {
                        splashWrapper.remove();
                    }, 1200);

                }, 600);
            }
        });
    </script>
</body>
</html>
