  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const EXEC_URL = 'https://script.google.com/macros/s/AKfycbxDA8zJmYCmhB2wIE-qdh9Y2czhUjsKODQ7z7GWSxDENqMRBiVM8CjKv5T5fhriOzbHWg/exec';
      const SPLASH_ONCE_PER_SESSION = true;
      const MIN_LOADING_DURATION = 7600;
      const MAX_WAIT_IFRAME = 12000;
      const UPDATE_INTERVAL = 30;
      const progressFill = document.getElementById('progress-fill');
      const progressPercent = document.getElementById('progress-percent');
      const logText = document.getElementById('log-text');
      const subLogText = document.getElementById('sub-log-text');
      const statusDot = document.getElementById('status-dot');
      const splashWrapper = document.getElementById('splash-wrapper');
      const appContainer = document.getElementById('app-container');
      const appFrame = document.getElementById('app-frame');
      let iframeLoaded = false, minTimeCompleted = false, forceReleased = false, currentPercent = 0, completed = false;
      const logs = [
        { msg:'Menyiapkan ruang kerja...', sub:'Memverifikasi Sertifikat Keamanan' },
        { msg:'Memuat modul agenda...', sub:'Menghubungkan Workspace Kalender' },
        { msg:'Sinkronisasi kalender...', sub:'Menyiapkan Data Agenda OJK DIY' },
        { msg:'Membangun antarmuka...', sub:'Rendering Komponen Sistem' },
        { msg:'Mengaktifkan layanan server...', sub:'Koneksi ke Google Apps Script' },
        { msg:'Finalisasi integrasi...', sub:'Membuka Ruang Kerja Agenda' }
      ];
      appFrame.src = EXEC_URL;
      appFrame.addEventListener('load', function () { iframeLoaded = true; tryReveal(); });
      if (SPLASH_ONCE_PER_SESSION && sessionStorage.getItem('agendaSplashDone') === '1') { fastReveal(); return; }
      const startedAt = Date.now();
      const timer = setInterval(function () {
        const ratio = Math.min((Date.now() - startedAt) / MIN_LOADING_DURATION, 1);
        const eased = ratio * (2 - ratio);
        const targetPercent = Math.min(Math.floor(eased * 100), 100);
        if (targetPercent !== currentPercent) { currentPercent = targetPercent; progressFill.style.width = currentPercent + '%'; progressPercent.innerText = currentPercent; }
        const logIndex = Math.min(Math.floor(ratio * logs.length), logs.length - 1);
        if (logText.innerText !== logs[logIndex].msg) {
          logText.style.opacity = '0'; subLogText.style.opacity = '0';
          setTimeout(function () { logText.innerText = logs[logIndex].msg; subLogText.innerText = logs[logIndex].sub; logText.style.opacity = '1'; subLogText.style.opacity = '1'; }, 150);
        }
        if (ratio >= 1) { clearInterval(timer); minTimeCompleted = true; tryReveal(); }
      }, UPDATE_INTERVAL);
      setTimeout(function () { forceReleased = true; tryReveal(); }, MAX_WAIT_IFRAME);
      function tryReveal() { if (completed) return; if (!minTimeCompleted && !forceReleased) return; if (!iframeLoaded && !forceReleased) return; completeLoading(); }
      function completeLoading() {
        if (completed) return; completed = true; sessionStorage.setItem('agendaSplashDone', '1');
        progressFill.style.width = '100%'; progressPercent.innerText = '100'; logText.innerText = 'Akses terverifikasi.'; logText.classList.remove('text-slate-800'); logText.classList.add('text-emerald-600'); subLogText.innerText = 'Membuka Workspace Agenda';
        if (statusDot) { statusDot.classList.remove('bg-emerald-500'); statusDot.classList.add('bg-emerald-600'); }
        setTimeout(function () { splashWrapper.classList.add('slide-out'); appContainer.classList.add('app-active'); document.body.classList.add('app-revealed'); setTimeout(function () { if (splashWrapper && splashWrapper.parentNode) splashWrapper.parentNode.removeChild(splashWrapper); }, 1200); }, 450);
      }
      function fastReveal() { appContainer.classList.add('app-active'); document.body.classList.add('app-revealed'); if (splashWrapper && splashWrapper.parentNode) splashWrapper.parentNode.removeChild(splashWrapper); }
    });
    if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); }); }
  </script>
